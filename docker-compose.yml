services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - clinic_db_data:/var/lib/postgresql/data

volumes:
  clinic_db_data:
